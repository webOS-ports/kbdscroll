# Unihertz Titan Pocket (codename Titan_pocket; the lookup lowercases it).
#
# The keys double as a Synaptics RMI4 touch surface (protocol B on paper, one
# contact in practice - see below), which the kernel exposes through the
# mainline RMI4 driver as a touchpad named after the
# controller's product id - "Synaptics 63022-001" as read on the hardware by
# the TitanPocket-OpenLinux project, whose glue driver this kernel carries.
# Their recording of it: ABS_MT_POSITION_X 101-683, Y 120-360.
#
# The compositor reads one named touchscreen and the keyboards, nothing else,
# so nothing on LuneOS consumes the pad but this.
#
# mtk-tpd speaks multitouch protocol A and has no slots, so kbdscroll writes
# protocol A frames into it and stays off the glass while a finger is on it
# (detected from mtk-tpd itself, no setting needed). Before that, injected drags
# landed in the real finger's frames and the screen felt broken (measured
# 11 Nov 2026).
#
# The pad reports one contact at a time. Its controller has to sleep while a
# key is down: every key press pushes into the sensor, and scanning through
# them drifts its baseline until it holds a touch that never lifts (BTN_TOUCH
# stuck at 1 with nothing on the keys) and reports slides as full-pressure
# points hopping around a corner - the noise that had kbdscroll switched off
# here before. The stock key driver sleeps it; our kernel does the same from
# shr-distribution/linux 0dc459448fd3 on (11 Nov 2026). On an older kernel,
# re-binding rmi4_i2c (6-0020) with the keys untouched clears it for a while.
pad = Synaptics*
screen = mtk-tpd
keys = aw9523-key

# There is no separate arrow-key node: the arrows go out through uinput.
arrows = uinput

# Alt is KEY_RIGHTALT on this keyboard, which the default cursor-modifier
# (leftalt,rightalt) already covers, and Fn is Ctrl, so the default word delete
# (leftctrl+backspace) is typeable too.
text-focus-file = /run/maliit-text-focus

# No numbers yet: scale, slop and the cursor steps are derived from the pad's
# and the screen's geometry until someone tunes them on the hardware. Check the
# direction first (kbdscroll --list, then debug=1) and correct the mounting with
# pad-rotate / pad-invert-x / pad-invert-y if a slide scrolls the wrong way.
